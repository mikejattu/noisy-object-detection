# Eval-pipeline config — shape-vs-texture + frequency-corruption study
# Generated by build_benchmark.py; copy and adjust paths before running.
#
# Run the sweep:
#   python -m model_pipeline.eval.run model_pipeline/configs/example.yaml
# Run the guard only:
#   python -m model_pipeline.eval.guard model_pipeline/configs/example.yaml

run_id: freq-corruption-v1
device: cuda

# ── Input seam ────────────────────────────────────────────────────────────────
# data_root == output_dir from build_benchmark.py.
# manifest columns (contract): image_id | path | label | corruption | severity | draw
data_root: ./output
manifest:  ./output/metadata/manifest.parquet

# ── Output seam ───────────────────────────────────────────────────────────────
results_dir:  model_pipeline/results
results_file: results.parquet

# ── Models ────────────────────────────────────────────────────────────────────
models:
  - resnet50_in1k       # texture-biased pole  (shape-texture axis)
  - resnet50_sin        # shape-biased pole    (shape-texture axis)
  - vit_b16_in1k        # attention vs. conv   (spatial-integration axis)
  - convnext_b_in1k     # conv op vs. recipe   (conv-op-vs-recipe axis)
  - clip_vit_b16        # language-aligned obj (training-objective axis)
  - resnet50_augmix     # explicit robustness  (robustness-training axis)

# ── Corruption sweep ──────────────────────────────────────────────────────────
# Names must exactly match the manifest's `corruption` column.
# Frequency ordering: high → mid → low (matches frequency_rank in manifest).
corruptions:
  # HIGH-FREQUENCY-DOMINANT
  - gaussian_noise
  - shot_noise
  - jpeg_compression
  # MID-FREQUENCY / EDGE-BAND
  - pixelate
  - defocus_blur
  - motion_blur
  # LOW-FREQUENCY / GLOBAL
  - fog
  - contrast

severities: [1, 2, 3, 4, 5]

# seeds maps to `draw` in the manifest.
# stochastic corruptions (gaussian_noise, shot_noise) have draws 0..2 as distinct renders.
# deterministic corruptions have draw=0 only (the same file is listed under all draws).
seeds: [0, 1, 2]

# ── Eval settings ─────────────────────────────────────────────────────────────
eval:
  batch_size: 256
  num_workers: 8
  metrics: [top1, top5, nll, ece]
  dtype: fp32        # fp32 for determinism; fp16/bf16 only if proven value-invariant
  ece_bins: 15

# ── Clean-set sanity guard ────────────────────────────────────────────────────
# Before each model's sweep, measures clean top-1 and aborts if it falls below
# expected_top1 - tolerance_pct. Catches gross wiring errors (wrong normalization,
# label order) before any compute goes into corruptions.
#
# With 50 source images, binomial noise ~14% (1σ) at top-1=0.76, so the 5pt
# tolerance is the right order of magnitude to catch hard wiring errors.
# Increase num_images in build_benchmark.py for tighter statistical coverage.
#
# Run standalone: python -m model_pipeline.eval.guard model_pipeline/configs/example.yaml
guard:
  enabled: true
  n: 1000                # subsamples at most n images (returns all 50 if n >= 50)
  tolerance_pct: 5.0     # floor = expected_top1 - tolerance_pct
  subsample_seed: 0
  clean:
    corruption: clean
    severity: 0
    draw: 0              # the clean slice has exactly one draw; guard selects draw=0
