# Which models x which corruption sets. Snapshotted next to each results file for repro.
run_id: shape-texture-v1
device: cuda

# Input seam (corruption owner's output): manifest is authoritative; paths resolve against data_root.
data_root: /data/corrupted
manifest: /data/corrupted/manifest.parquet   # columns: image_id, path, label, corruption, severity, draw

# Output seam (gitignored).
results_dir: model_pipeline/results
results_file: results.parquet

models:
  - resnet50_in1k
  - resnet50_sin
  - vit_b16_in1k
  - convnext_b_in1k
  - clip_vit_b16
  - resnet50_augmix

corruptions:                 # owned by the corruption teammate; names must match the manifest
  - gaussian_noise
  - shot_noise
  - impulse_noise
severities: [1, 2, 3, 4, 5]
seeds: [0, 1, 2]             # each maps to a `draw` index in the manifest (replicate-draw selector)

eval:
  batch_size: 256
  num_workers: 8
  metrics: [top1, top5, nll, ece]
  dtype: fp32
  ece_bins: 15

# Clean-set sanity guard: before each model's sweep, measure clean top-1 and abort if it
# falls below expected_top1 - tolerance_pct. Catches gross wiring errors (wrong normalization,
# label order) before any GPU hours go into corruptions. Run standalone:
#   python -m model_pipeline.eval.guard model_pipeline/configs/example.yaml
guard:
  enabled: true
  n: 1000                # deterministic image subsample per model
  tolerance_pct: 5.0     # floor = expected_top1 - tolerance (sized to catch >=5pt errors, not 0.5%)
  subsample_seed: 0
  clean:                 # which manifest slice is "uncorrupted" — MATCH the corruption owner's convention
    corruption: clean
    severity: 0
    # draw: 0            # defaults to the first configured seed
    # manifest: /data/clean/manifest.parquet   # override if clean images live outside the corruption manifest
